[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Build-time env for Vite. The anon key is a PUBLIC client key (ships in the
# browser bundle; data is protected by Supabase RLS). Safe to commit. With these
# set, submitOrder() inserts into the shared Supabase project. Override in
# Netlify's UI to point a build at a different project.
[build.environment]
  # These are PUBLIC client keys and are meant to ship in the browser bundle, so
  # tell Netlify's secrets scanner not to fail on finding them. (The Stripe
  # SECRET key is never here — it's a Functions-scoped env var set in the UI.)
  SECRETS_SCAN_OMIT_KEYS = "VITE_STRIPE_PUBLISHABLE_KEY,VITE_SUPABASE_ANON_KEY"
  VITE_SUPABASE_URL = "https://kboevpucqjoftgmhrkzq.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtib2V2cHVjcWpvZnRnbWhya3pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5Mjk0OTUsImV4cCI6MjA5NjUwNTQ5NX0.T6W1QPUrVIqXsGog5axDlDneTUwZJnYu_JClIDVCkPc"
  VITE_VENUE_ID = "uri-mens-soccer"
  VITE_EVENT_ID = "uri-lasalle-msoc"
  # Stripe publishable key is public (ships in the browser). LIVE key — must be
  # the same mode as the SECRET key (sk_live_…) set in Netlify's UI as SECRET_KEY.
  VITE_STRIPE_PUBLISHABLE_KEY = "pk_live_51URPUb6iLrLSyhKNLY39oB82nTYDqQVH20Ei8t8H5h6FCdqdr2H5Pbjg7X7cxvCxswoHuq3Kf44kLUEwN8JRPe0T00j5Krmfl2"

# SPA routing — send all paths to index.html so client-side routes work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
