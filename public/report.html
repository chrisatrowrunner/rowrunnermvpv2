<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>RowRunner — Payout report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --navy:#072E48; --ice:#5BB8D4; --line:#e6ebf1; --muted:#5e7387; --green:#22c55e; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #fff; background: radial-gradient(120% 60% at 50% 0%, #0E3F5E, #072E48 70%);
        display: flex; justify-content: center; padding: 28px 18px;
      }
      .wrap { width: 100%; max-width: 460px; }
      h1 { font-size: 26px; font-weight: 800; margin: 6px 0 2px; }
      .sub { color: var(--ice); font-weight: 600; font-size: 14px; margin-bottom: 22px; }
      .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
      label { display:block; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
      input { width: 100%; height: 48px; border-radius: 12px; padding: 0 14px; font-size: 16px; font-weight: 600; color:#fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); outline: none; font-family: inherit; }
      .row { display: flex; gap: 10px; }
      .row > div { flex: 1; }
      button { width: 100%; height: 52px; margin-top: 14px; border: none; border-radius: 14px; background: var(--ice); color: var(--navy); font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit; }
      button:disabled { opacity: .7; cursor: default; }
      .big { background: var(--ice); color: var(--navy); border: none; }
      .big .amt { font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-top: 4px; }
      .big .lbl { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; opacity: .75; }
      .line { display:flex; justify-content: space-between; align-items:center; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.12); font-weight: 700; }
      .line:first-child { border-top: none; }
      .line .k { color: rgba(255,255,255,.7); font-weight: 600; }
      .err { color:#FCA5A5; font-weight: 700; font-size: 14px; margin-top: 10px; }
      .note { color: rgba(255,255,255,.5); font-size: 12px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Payout report</h1>
      <div class="sub">What you owe Pam's Grill — live from Stripe</div>

      <div class="card" id="controls">
        <label>Access code</label>
        <input id="code" type="password" placeholder="Access code" autocomplete="off" />
        <div class="row" style="margin-top:12px">
          <div><label>From (optional)</label><input id="from" type="date" /></div>
          <div><label>To (optional)</label><input id="to" type="date" /></div>
        </div>
        <button id="go">Show payout</button>
        <div class="err" id="err" style="display:none"></div>
        <div class="note">Leave dates blank for all time. Only succeeded, non-refunded orders count.</div>
      </div>

      <div id="results"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id)
      const money = (n) => '$' + Number(n).toFixed(2)
      // remember the code for this tab
      try { $('code').value = sessionStorage.getItem('rr_report_code') || '' } catch {}

      async function load() {
        const code = $('code').value.trim()
        $('err').style.display = 'none'
        if (!code) { showErr('Enter the access code.'); return }
        try { sessionStorage.setItem('rr_report_code', code) } catch {}
        const p = new URLSearchParams()
        if ($('from').value) p.set('from', $('from').value)
        if ($('to').value) p.set('to', $('to').value)
        $('go').disabled = true; $('go').textContent = 'Loading…'
        try {
          const res = await fetch('/.netlify/functions/vendor-report?' + p.toString(), {
            headers: { 'x-report-token': code },
          })
          const d = await res.json()
          if (!res.ok) { showErr(d.error || 'Could not load'); return }
          render(d)
        } catch (e) {
          showErr('Network error — try again')
        } finally {
          $('go').disabled = false; $('go').textContent = 'Show payout'
        }
      }

      function showErr(m) { $('err').textContent = m; $('err').style.display = 'block'; $('results').innerHTML = '' }

      function render(d) {
        const unlabeled = d.unlabeledOrders > 0
          ? `<div class="note">${d.unlabeledOrders} order(s) had no split tag (placed before the split was added) — not included in Pam's total.</div>` : ''
        $('results').innerHTML = `
          <div class="card big">
            <div class="lbl">Pay Pam's Grill</div>
            <div class="amt">${money(d.pamsOwed)}</div>
          </div>
          <div class="card">
            <div class="line"><span class="k">Your fees collected</span><span>${money(d.platformFees)}</span></div>
            <div class="line"><span class="k">Tips (for runners)</span><span>${money(d.tips)}</span></div>
            <div class="line"><span class="k">Gross charged</span><span>${money(d.gross)}</span></div>
            <div class="line"><span class="k">Stripe fees (est.)</span><span>−${money(d.stripeFeesEst)}</span></div>
            <div class="line"><span class="k">Your net (after Pam's + Stripe)</span><span>${money(d.yourNet)}</span></div>
            <div class="line"><span class="k">Orders counted</span><span>${d.orders}</span></div>
            ${d.refundedExcluded ? `<div class="line"><span class="k">Refunded (excluded)</span><span>${d.refundedExcluded}</span></div>` : ''}
          </div>
          ${unlabeled}
          <div class="note">Range: ${d.range.from} → ${d.range.to}. Tips are meant for runners, not Pam's or you.</div>
        `
      }

      $('go').addEventListener('click', load)
      $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') load() })
    </script>
  </body>
</html>
